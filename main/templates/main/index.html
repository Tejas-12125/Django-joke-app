<!DOCTYPE html>
<html>
<head>
    <title>Joke App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f0ff, #f8e8ff);
            text-align: center;
            padding-top: 120px;
        }

        .joke {
            background: white;
            width: 500px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        h2 {
            color: #333;
        }

        h3 {
            color: #555;
            font-weight: normal;
        }
    </style>
</head>

<body>

    <div class="joke">
        <h2>😂 Joke of the Day</h2>
        <h3>{{ joke }}</h3>
    </div>

</body>
</html>
